spring.application.name=returns-service
server.servlet.context-path=/returns
server.port=9093
spring.profiles.active=dev

# Redis cache configuration
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true


# HikariCP settings
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.isolation-level=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.pool-name=HikariConnectionPool
spring.datasource.test-while-idle=true

#Database
spring.datasource.url=jdbc:mysql://147.93.157.141:3306/POS_DPD_CHEMICAL?serverTimezone=Asia/Colombo
spring.jackson.time-zone=Asia/Colombo
spring.datasource.username=online
spring.datasource.password=POS_dpd_CHEMICAL!1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#JWT configurations
jwt.token.secret.key=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7d8PjiTL6B4RfUvcW7vV0cEx...
jwt.token.exp.time = 2400000

#Date format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

#Eureka client
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Zipkin tracing
spring.zipkin.base-url=http://localhost:9411/
spring.sleuth.sampler.probability=1.0
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain
server.compression.min-response-size=1024

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.accept-count=100
